<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scalpair — AI Scalping Screener</title>
  <meta name="description" content="Real-time order book density, AI scalp scores and setup detection. Read-only. No keys. No execution." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=0.4.1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2313161a'/><path d='M22 68 L42 34 L56 56 L78 28' stroke='%232f9e63' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
</head>
<body>
  <!-- ================= TOP BAR (минимум) ================= -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">Scalpair</span>
      <span class="brand-status mono" id="feed-badge">…</span>
    </div>

    <div class="controls">
      <input id="search" class="ctl search-input" type="search" placeholder="Поиск…" aria-label="Symbol search" />
      <button id="bell" class="ctl ctl-btn" aria-label="Notifications">Алерты<span id="bell-count" class="bell-count hidden">0</span></button>
      <button id="burger" class="ctl ctl-btn burger" aria-label="Settings">☰</button>
    </div>
  </header>

  <!-- ================= SETTINGS MENU (burger) ================= -->
  <div id="settings-menu" class="settings-menu hidden">
    <div class="set-row"><span>Фид</span><span class="mono" id="set-feed">—</span></div>
    <div class="set-row"><span>Звук (скор ≥ 85)</span><button id="sound-toggle" class="ctl ctl-btn" aria-label="Toggle alert sound">Звук выкл</button></div>
    <div class="set-row"><span>Язык / Language</span><button id="lang-toggle" class="ctl ctl-btn">RU</button></div>
    <div class="set-row"><span>Мин. скоринг</span>
      <select id="min-score" class="ctl" aria-label="Minimum AI score filter">
        <option value="0" selected>≥ 0</option>
        <option value="40">≥ 40</option>
        <option value="60">≥ 60</option>
        <option value="80">≥ 80</option>
        <option value="90">≥ 90</option>
      </select>
    </div>
    <div class="set-row"><span>Мин. стена</span>
      <select id="wall-filter" class="ctl" aria-label="Wall notional filter">
        <option value="0" selected>все</option>
        <option value="250000">≥ $250K</option>
        <option value="1000000">≥ $1M</option>
        <option value="5000000">≥ $5M</option>
      </select>
    </div>
    <div class="set-row"><span>Часовой пояс</span><span class="mono" style="color:var(--text-3)">UTC</span></div>
  </div>

  <!-- notifications dropdown + toasts -->
  <div id="notif-panel" class="notif-panel hidden mono"></div>
  <div id="toasts" class="toasts"></div>

  <!-- ================= MAIN GRID ================= -->
  <main class="layout">
    <!-- Left: top setups + scanner table -->
    <section class="left-col">
      <section class="panel topsetups-panel">
        <div class="panel-head">
          <h2 id="h2-topsetups">Топ сетапы</h2>
          <span class="panel-hint mono" id="feed-hint">—</span>
        </div>
        <div id="topsetups-body" class="topsetups-body">
          <div class="empty-note">движок считает…</div>
        </div>
      </section>

      <section class="panel table-panel" id="table-panel">
        <div class="panel-head">
          <h2 id="h2-scanner">Сканер</h2>
          <span class="panel-hint mono">L2 · flow · уровни</span>
        </div>
        <div class="table-wrap">
          <table class="term-table" id="main-table">
            <thead>
              <tr>
                <th class="col-sym">Тикер</th>
                <th class="num">Цена</th>
                <th class="col-trend">Тренд <span class="hint-inline">10м</span></th>
                <th class="num">5м %</th>
                <th class="num">Всплеск</th>
                <th class="col-imb">Стакан</th>
                <th class="num">Уровень</th>
                <th class="col-tag">Сетап</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
          <div id="table-empty" class="empty-note">ожидание данных…</div>
        </div>
      </section>
    </section>

    <!-- Right: chart board -->
    <aside class="rail">
      <section class="panel board-panel" id="board-panel">
        <div class="panel-head">
          <h2 id="h2-board">Доска</h2>
          <div class="board-controls">
            <select id="grid-size" class="ctl" aria-label="Board grid size">
              <option value="1">1×1</option>
              <option value="2">2×2</option>
              <option value="3" selected>3×3</option>
              <option value="4">4×4</option>
            </select>
            <button id="page-prev" class="ctl ctl-btn" aria-label="Previous page">‹</button>
            <span id="page-ind" class="mono page-ind">1/1</span>
            <button id="page-next" class="ctl ctl-btn" aria-label="Next page">›</button>
          </div>
        </div>
        <div class="board-grid" id="board-grid"></div>
        <div class="empty-note" id="board-empty">ожидание данных…</div>
      </section>
    </aside>
  </main>

  <!-- ================= CHART MODAL ================= -->
  <div id="chart-modal" class="modal hidden">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="chart-title">
      <div class="modal-head">
        <h3 id="chart-title" class="mono">—</h3>
        <div class="modal-head-right">
          <div class="tf-picker" id="tf-picker" role="group" aria-label="Timeframe">
            <button class="tf-btn active" data-tf="1">1m</button>
            <button class="tf-btn" data-tf="5">5m</button>
            <button class="tf-btn" data-tf="15">15m</button>
            <button class="tf-btn" data-tf="60">1h</button>
          </div>
          <span id="chart-tag" class="tag-text"></span>
          <button id="chart-close" class="ctl ctl-btn">Закрыть</button>
        </div>
      </div>
      <canvas id="chart-canvas" width="900" height="380"></canvas>
      <div class="chart-alert-row">
        <span class="mono" style="color:var(--text-3)">alert:</span>
        <span id="alert-symbol" class="mono">—</span>
        <select id="alert-type" aria-label="Alert rule type">
          <option value="price_cross_above">цена выше</option>
          <option value="price_cross_below">цена ниже</option>
          <option value="pct_move">движение %</option>
          <option value="volume_surge">всплеск объёма x</option>
          <option value="score_above">скоринг ≥</option>
        </select>
        <input id="alert-threshold" type="number" step="any" min="0" placeholder="порог" />
        <button id="alert-create" class="ctl ctl-btn">Создать алерт</button>
      </div>
      <p id="chart-thesis" class="modal-thesis mono"></p>
    </div>
  </div>

  <!-- tiny clock, bottom-right -->
  <div class="clock-corner mono" id="clock">--:--:--</div>

  <script src="/js/app.js?v=0.4.1"></script>
</body>
</html>
